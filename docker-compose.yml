services:
  scrape_pages:
    build: .
    restart: "no"
    env_file:
      - path: .env
        required: false
    environment:
      STAYUP_API_URL: ${STAYUP_API_URL:-http://localhost:3000}
      STAYUP_API_KEY: ${STAYUP_API_KEY}

  admin:
    build: .
    entrypoint: ["gunicorn", "--bind", "0.0.0.0:8000", "admin:app"]
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      STAYUP_API_URL: ${STAYUP_API_URL:-http://localhost:3000}
      STAYUP_API_KEY: ${STAYUP_API_KEY}
      SCRAP_ADMIN_EMAIL: ${SCRAP_ADMIN_EMAIL}
      SCRAP_ADMIN_PASSWORD: ${SCRAP_ADMIN_PASSWORD}
      SCRAP_ADMIN_SECRET: ${SCRAP_ADMIN_SECRET}
    ports:
      - "8000:8000"

  test:
    build: .
    entrypoint: ["python", "-m", "pytest", "tests/", "-v"]
    restart: "no"
