<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Scrap admin{% endblock %}</title>
    <style>
      :root {
        --bg: #0e1119;
        --surface: #171b26;
        --border: #2a2f3d;
        --fg: #e7e9ee;
        --dim: #9aa0ad;
        --accent: #9dc7e0;
        --danger: #e0808f;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      a { color: var(--accent); }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 24px;
        border-bottom: 1px solid var(--border);
      }
      header .brand { font-weight: 600; }
      main { max-width: 900px; margin: 0 auto; padding: 24px; }
      h1 { font-size: 20px; margin: 0 0 16px; }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
      th { color: var(--dim); font-weight: 500; font-size: 13px; }
      code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; color: var(--dim); }
      .btn {
        display: inline-block;
        padding: 7px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
        color: var(--fg);
        font: inherit;
        cursor: pointer;
        text-decoration: none;
      }
      .btn.primary { background: var(--accent); color: #0e1119; border-color: var(--accent); }
      .btn.danger { color: var(--danger); }
      .btn.link { border: 0; background: none; padding: 4px; }
      form.inline { display: inline; }
      label { display: block; margin: 14px 0 4px; font-size: 13px; color: var(--dim); }
      input[type="text"], input[type="url"], input[type="password"], input[type="number"], textarea {
        width: 100%;
        padding: 8px 10px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--fg);
        font: inherit;
      }
      textarea { min-height: 72px; resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .flash { margin: 0 0 16px; padding: 10px 12px; border: 1px solid var(--accent); border-radius: 8px; background: var(--surface); }
      .actions { display: flex; gap: 8px; margin-top: 20px; }
      .muted { color: var(--dim); }
    </style>
  </head>
  <body>
    {% if session.get('user') %}
      <header>
        <span class="brand">Scrap — flux</span>
        <span>
          <span class="muted">{{ session['user'] }}</span>
          <form class="inline" method="post" action="{{ url_for('logout') }}">
            <button class="btn link" type="submit">Déconnexion</button>
          </form>
        </span>
      </header>
    {% endif %}
    <main>
      {% with messages = get_flashed_messages() %}
        {% for message in messages %}
          <p class="flash">{{ message }}</p>
        {% endfor %}
      {% endwith %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
